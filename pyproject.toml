[project]
name = "cac-jira"
dynamic = ["version"]
description = "A command-line interface for interacting with Jira"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [
    { name = "Ryan Punt", email = "ryan@mirum.org" },
]
keywords = ["jira", "cli", "atlassian", "project-management", "command-lint", "python", "cli-tool"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
    "cac-core>=2.0.1,<3.0.0",
    "tabulate>=0.9.0",
    "jira>=3.10.5,<4.0.0",
    "pyyaml>=6.0.2",
    "keyring>=25.5.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "types-pyyaml>=6.0.12",
    "types-tabulate>=0.9.0",
]
test = [
    "pytest>=7.3.1",
    "pytest-cov>=4.0.0",
]
lint = [
    "ruff>=0.9.0",
    "black>=23.3,<27.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.2.0",
]
all = [
    "pyright>=1.1.390",
    "types-pyyaml>=6.0.12",
    "types-tabulate>=0.9.0",
    "pytest>=7.3.1",
    "pytest-cov>=4.0.0",
    "ruff>=0.9.0",
    "black>=23.3,<27.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.2.0",
]

[project.scripts]
jira = "cac_jira:main"

[project.urls]
homepage = "https://mirum.org/cac-jira/"
repository = "https://github.com/rpunt/cac-jira"

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["."]
include = ["cac_jira*"]

[tool.setuptools.package-data]
"cac_jira" = ["config/*.yaml"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.pyright]
# Resolve imports (cac_core, jira, pytest, ...) against the project virtualenv
# so Pylance/pyright match the interpreter used at runtime and by mypy.
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
